# Puerto donde correrá tu API (puedes usar el 8080 que es el estándar de Spring, o el 3000 que usabas antes)
server.port=8080

# Configuración de conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/travelpoint_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate (ORM)
# 'update' crea las tablas automáticamente si no existen basándose en tus Entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect